# C3: 4 parallel MuJoCo envs + disturbance curriculum (last scale lever on MuJoCo)
robot: g1
control_dt: 0.02

sonic:
  token_dim: 64
  action_dim: 29
  decoder_output_keys: ["pd_targets"]

apt:
  latent_dim: 64
  aux_dim: 12
  num_skills: 2
  aux_scale: 0.15
  kp: 80
  kd: 2
  use_skill_selection: false
  initial_token_path: null
  initial_aux_std: 0.01
  train_token: false

mujoco:
  robot_scene: gear_sonic/data/robot_model/model_data/g1/scene_43dof.xml
  wbc_config_path: gear_sonic/utils/mujoco_sim/wbc_configs/g1_29dof_sonic_model12.yaml
  sim_dt: 0.005
  control_decimation: 4
  episode_length_s: 12.0
  use_elastic_band: false
  band_scale: 0.0

commands:
  stand_only: false
  vx_min: 0.0
  vx_max: 0.8
  vy_min: 0.0
  vy_max: 0.0
  yaw_min: 0.0
  yaw_max: 0.0

training:
  num_envs: 4
  num_steps: 128
  max_iterations: 250
  save_interval: 50
  log_interval: 10
  output_dir: outputs/apt_aux_4env
  band_anneal_iters: 0
  disturbance_prob: 0.35
  disturbance_force_range: [200.0, 500.0]

ppo:
  lr: 0.0003
  minibatch_size: 256
  num_epochs: 10
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  entropy_coef: 0.0003
  value_coef: 0.5
  max_grad_norm: 0.5
